# Settings for the analysis step (`wbscraper analyze`). The scraper never reads this file.
# Sentiment measures how a post feels about a Water Boards website or online system itself.
# See docs/SENTIMENT.md for the method, the evidence behind each number and the measured accuracy.

sentiment:
  # nltk-vader-sentiment: maintained re-implementation of VADER with the upstream bugs fixed (default).
  # vaderSentiment: the original 3.3.2 package, kept for comparison only.
  backend: nltk-vader-sentiment
  alpha: 15                 # VADER's normalisation constant (its default; not tuned)
  aggregate: vote           # vote | mean | sum -- how sentence scores become a post score (docs/SENTIMENT.md, Round 2)
  sum_alpha: 1.0            # only used by aggregate: sum
  thresholds:               # score <= negative -> negative; score >= positive -> positive; otherwise neutral
    negative: -0.2          # locked by `wbscraper analyze-eval` on the development set (see docs/SENTIMENT.md)
    positive: 0.55
  mixed_cutoff: 0.3         # one focus sentence >= +0.3 and another <= -0.3 -> flagged "mixed" for review
  review_margin: 0.10       # scores this close to a threshold are flagged for review (exact 0.0 is not)

tagging:
  model: claude-opus-5-5
  effort: medium            # low | medium | high
  max_tokens: 4000
  fallbacks: default        # server-side refusal fallback; set to "off" to disable
  prompt_version: 1         # bump when the prompt or tag lists change; cached tags from older versions are ignored
  price_per_mtok:           # USD per million tokens, used only for the printed cost estimate
    input: 4.00
    output: 20.00
    cache_write: 5.00
    cache_read: 0.20

paths:                      # relative to the data directory (default: data/)
  input: output/waterboards_feedback.csv
  borderline_input: output/borderline_review.csv
  scored: output/waterboards_feedback_scored.csv
  summary: output/sentiment_summary.md
  review: analysis/review.csv
  tag_cache: analysis/tag_cache.json
  gold_relevant: analysis/gold_relevant.csv
  gold_tuning: analysis/gold_tuning.csv
  ai_review: analysis/ai_review.csv       # AI-assisted review of individual posts; read by `analyze`, never rewritten by it
  gold_pool: analysis/gold_pool.csv       # extra hand-labelled posts from the database (Round 2 development data)
  eval_report: analysis/eval_report.md
