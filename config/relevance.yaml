# Two-stage relevance (see src/wbscraper/relevance.py and docs/SEARCH_TERMS.md).
#   Stage 1: the text itself must establish a California Water Boards connection (system, organisation, or a
#            programme term together with a California / Water Boards qualifier).
#   Stage 2: it must show evidence of using a website, portal or online process (config/terms/signals.yaml).
# The tier comes from these rules, not from a score threshold; the weights below only make `score` a useful
# sort key for reviewing items.
weights:
  system: 3.0
  system_weak: 2.5      # ambiguous name that appeared together with its required context words
  org: 3.0
  org_weak: 2.0
  program: 1.5
  usability: 1.5        # per distinct interface term (website, portal, login, upload, ...), up to usability_cap
  usability_cap: 2
  process: 0.5
  process_cap: 2
  experience: 0.5
  experience_cap: 2
  california: 0.5
  thread_exception: 1.0
  hard_negative: 4.0    # look-alike patterns with at least this penalty reject the item outright

retired_queries:      # pending searches for these exact queries are cancelled by `wbscraper rescore`
  - WDID
