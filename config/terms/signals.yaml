# Stage-2 vocabulary: evidence that an item is about *using* a website, portal or online process.
# Matched case-insensitively on word boundaries (suffixes like -s/-ed/-ing are allowed).
#
# usability  (A) specific to web interfaces. Generic words ("account", "error", "system") never belong here.
# process    (B) things people do in an online system. Too generic to count without a Water Boards system named.
# experience (C) complaint / praise / question wording. Never sufficient on its own.
# See docs/SEARCH_TERMS.md ("Relevance rules") for how A, B and C are combined.

