# Weaker wording: enough to qualify a *named system* next to interface/process vocabulary, but never an
# organisation-only mention on its own.
usability_generic:
  # members of `usability` that name the medium rather than an interface element. Evidence next to a complaint in the
  # same sentence, but a reply with no Water Boards connection of its own needs something more specific than "website".
  - website
  - web site
  - webpage
  - web page
  - online
  - internet

usage_words:
  # ("use" alone is too generic: "resources being used on sites")
  # a person *using* (or telling someone how to use) a named system. Only counts in the same sentence as the system's
  # name ("use GeoTracker", "look it up on GeoTracker", "all the info can be found on GeoTracker"), so the system must
  # be the thing being used, not a name dropped somewhere in a long text.
  - use the
  - using the
  - used the
  - use a
  - using a
  - to use
  - can use
  - just use
  - should use
  - we use
  - i use
  - would use
  - look up
  - looking up
  - looked up
  - lookup
  - search
  - check out
  - checking out
  - checked out
  - browse
  - put the address
  - type the address
  - enter the address
  - type in
  - pull up
  - head to
  - go to
  - can be found
  - you can find
  - you can see
  - you can view
  - learning
  - learned
  - amazing site
  - great site
  - best source

experience_soft:
  # members of `experience` that are praise, questions or outcomes rather than complaints. Fine in a person's post,
  # but a web article or a letter passage needs a real complaint (marketing says "easy", headings ask "how do I").
  - easy
  - easier
  - straightforward
  - smooth
  - intuitive
  - works well
  - how do i
  - how can i
  - anyone else
  - is it just me
  - denied
  - rejected
  - delayed
  - still waiting
  - no response
  - never heard back
  - never received
  - not received

instruction_steps:
  # walking someone through an interface ("go to the map, open the list of layers, turn on ..."). Two different steps
  # next to a named system count as usage evidence even without a complaint.
  - go to the
  - go to
  - open up
  - open the
  - click on
  - click the
  - select the
  - turn on
  - scroll down
  - type in
  - type the
  - you'll see
  - you will see

experience_help:
  # requests for help with using a system. With a *named system* they are real usability evidence; next to the
  # Boards in general ("does anyone know the number for the water board") they are not.
  - how to
  - has anyone
  - does anyone
  - anyone know
  - anyone else
  - is there a way
  - any idea
  - why is
  - why does
  - help with

experience_weak:
  # appraisals and filler: support a borderline result, never a relevant one on their own
  - great
  - love
  - worked
  - fixed
  - resolved
  - responsive
  - helpful
  - improved
  - question
  - confirm
  - slow
