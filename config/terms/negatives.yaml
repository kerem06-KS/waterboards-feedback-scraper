# Penalties for look-alikes. pattern/when are regular expressions (case-insensitive unless noted).
# unless_context: words/groups; if any is present the penalty is skipped.
negatives:
  - id: waterboarding
    pattern: '\bwater-?board(?:ing|ed|s)?\b.{0,40}\b(torture|interrogat|cia|guantanamo|detainee)'
    penalty: 6
  - id: waterboarding_word
    pattern: '\bwaterboard(?:ing|ed)\b'
    penalty: 6
  - id: geotracker_other_products
    when: 'geo\s?tracker'
    pattern: '\b(gps|gpx|android|ios|iphone|app store|play store|houdini|seo|llm|chatgpt|ai search|ai visibility|generative engine|saas|geo-?targeting|vehicle|truck|motorcycle|dog|pet tracker|backpack|hiking|garmin)\b'
    penalty: 3
    unless_context: ["@geotracker_ctx"]
  - id: smarts_other_products
    when: 'SMARTS'
    pattern: '\b(solar|irradiance|spectral|atmospheric|sunlight|smart contract|insurance|mutual fund|trading)\b'
    penalty: 4
    unless_context: ["@stormwater"]
  - id: other_water_boards
    pattern: '\b(texas water development board|tceq|kenya|nairobi|sri lanka|bangladesh|dwasa|karnataka|bangalore|bwssb|hyderabad|dutch water board|waterschap|auckland|cape town|ofwat|welsh water|severn trent|thames water|johannesburg|pakistan|wapda|lahore|karachi|nigeria|ghana)\b'
    penalty: 3
    unless_context: ["@california"]
  - id: sports_waterboard
    pattern: '\b(wake ?board|kite ?board|paddle ?board|skim ?board|surf ?board)\b'
    penalty: 2
    unless_context: ["@water_reg"]
  # news / outreach boilerplate: agency announcements are not user feedback about using a site
  - id: promo_boilerplate
    pattern: '\b(click|tap) (here )?to (read|learn|see|view|find out)\b|\blearn more here\b|\bread more here\b|\b(making|makes|make) it (much |even )?(easier|simpler)\b|\bregister (now )?for (the |our )?(webinar|workshop|training|info session|information session)\b'
    penalty: 2
  # vendor / consultant marketing ("cloud-based CIWQS compliance solutions"): selling a service is not using a site
  - id: vendor_promo
    pattern: '\b(request|book|schedule) (a |your )?(free )?(demo|consultation|quote)\b|\bfree trial\b|\bstart(ed)? (your )?free\b|\bsign ?up for free\b|\bget (a )?(free )?quote\b|\bpricing (plans?|starts)\b|\bcloud-based (solution|platform|software|compliance)s?\b|\bour (software|platform|compliance solutions?)\b|\bsubscribe to our newsletter\b'
    penalty: 4
  # code-change titles (feat(data): ..., fix: ...) are developers describing their own project, not site feedback
  - id: commit_message
    pattern: '\A\s*(feat|fix|chore|docs|refactor|build|ci|test|perf|style)(\([^)]*\))?!?:\s'
    penalty: 4
