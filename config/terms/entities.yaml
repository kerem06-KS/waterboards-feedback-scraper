# Entity library. Edit freely; no Python changes needed.
#
# kind:     org | system | topic
# strong:   unambiguous names (case-insensitive) - a hit alone is enough to count as an entity match
# weak:     ambiguous names; only count when one of the `context` words/groups ("@group") is also present.
#           case_sensitive: true is used for acronyms that collide with ordinary words (SMARTS vs smarts)
# domains:  URL fragments, treated as strong
# weight:   (topic only) score contribution, default from relevance.yaml
# anchors:  search strings by tier (1 = best yield). Used for subreddit-scoped and search-engine queries.
# pullpush: SINGLE distinctive tokens for PullPush's fuzzy global search (multi-word queries return junk there)
# web_extra: additional search-engine-only queries (context-qualified acronyms etc.)
# tasks:    things people do in the system; used by the natural-language question templates
# short:    short name used in question templates

entities:
  # ------------------------------------------------------------------ organisations
  - id: swrcb
    label: State Water Resources Control Board
    kind: org
    short: the State Water Board
    strong:
      - State Water Resources Control Board
      - State Water Resource Control Board
      - Water Resources Control Board
      - State Water Board
      - State Water Boards
      - California Water Boards
      - California Water Board
      - California State Water Board
      - State Water Quality Control Board
      - SWRCB
      - SWQCB
      - waterboards.ca.gov
      - swrcb.ca.gov
    weak:
      # "water board" is also a Texas/UK/Dutch/Indian institution: California must be named
      - { term: water boards, context: ["@california", "@waterboard_names"] }
      - { term: water board, context: ["@california"] }
    domains: [waterboards.ca.gov, swrcb.ca.gov]
    anchors:
      1: [SWRCB, State Water Board, State Water Resources Control Board, California Water Boards, waterboards.ca.gov]
      2: [Water Resources Control Board, California Water Board, State Water Quality Control Board, swrcb.ca.gov, waterboards website, water board portal]
      3: [state water board website, water board online application, water board login, water board help desk]
    pullpush: [SWRCB, waterboards.ca.gov, swrcb.ca.gov, waterboards]
    web_extra:
      - '"water board" website california'
      - '"water board" portal california'
    tasks: [submit an application, pay a fee, find a form, look up a permit, get a certificate]

